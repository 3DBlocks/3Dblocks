<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3DBLOCK · Catálogo</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#080b13" />
<style>
  :root{
    --bg: #080b13;
    --bg-2: #0d1220;
    --panel: #0f1524;
    --panel-2: #131b2e;
    --border: #1d2740;
    --border-soft: #161f34;
    --text: #e8ecf6;
    --text-dim: #8a93ac;
    --text-faint: #545e78;
    --accent: #f2b134;
    --accent-2: #2dd4bf;
    --mono: 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
    --sans: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  #topBar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 22px; border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, var(--panel), var(--bg-2)); position:sticky; top:0; z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-blocks{ display:grid; grid-template-columns:repeat(3,7px); grid-template-rows:repeat(3,7px); gap:2px; }
  .brand-blocks span{ background:var(--accent); display:block; }
  .brand-blocks span:nth-child(2){ background:var(--accent-2); }
  .brand-blocks span:nth-child(5){ background:var(--text-dim); }
  .brand-blocks span:nth-child(8){ background:#1c5049; }
  .brand-title{ font-size:16px; font-weight:800; letter-spacing:.1em; margin:0; }
  #topBar p{ margin:0; font-size:11px; color:var(--text-faint); }

  main{ max-width:1180px; margin:0 auto; padding:28px 22px 60px; }
  #hero{ text-align:center; margin-bottom:22px; }
  #hero h1{ font-size:clamp(22px,4vw,32px); font-weight:800; margin:0 0 8px; letter-spacing:-.01em; }
  #hero p{ font-size:13.5px; color:var(--text-dim); max-width:480px; margin:0 auto; line-height:1.6; }

  #catNav{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:28px; }
  #catNav a{
    text-decoration:none; font-size:12.5px; font-weight:600; color:var(--text-dim);
    background:var(--panel-2); border:1px solid var(--border-soft); border-radius:20px; padding:7px 15px;
    transition:all .12s ease;
  }
  #catNav a:hover{ border-color:var(--accent); color:var(--accent); }
  #catNav a.active{ background:var(--accent); color:#1a1305; border-color:var(--accent); }

  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:18px;
  }
  .card{
    background:var(--panel-2); border:1px solid var(--border-soft); border-radius:12px; overflow:hidden;
    cursor:pointer; transition: transform .15s ease, border-color .15s ease; display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .card .thumb-wrap{ aspect-ratio:1/1; background:#0a0e1a; position:relative; overflow:hidden; }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .thumb-wrap.empty{ display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-family:var(--mono); font-size:11px; }
  .card .price-tag{
    position:absolute; top:8px; right:8px; background:rgba(8,11,19,.85); backdrop-filter:blur(4px);
    border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-family:var(--mono); font-size:11.5px;
    font-weight:700; color:var(--accent);
  }
  .card .price-tag.free{ color:var(--accent-2); }
  .card .info{ padding:12px 14px 14px; }
  .card .name{ font-size:13.5px; font-weight:700; margin:0 0 4px; }
  .card .desc{ font-size:11px; color:var(--text-dim); line-height:1.4; margin:0 0 6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .cta{ font-size:10.5px; color:var(--text-faint); letter-spacing:.02em; }

  #emptyState, #loadingState{ text-align:center; padding:60px 20px; color:var(--text-faint); font-size:13px; display:none; }
  #emptyState.show, #loadingState.show{ display:block; }

  footer{ text-align:center; padding:24px; font-size:10.5px; color:var(--text-faint); border-top:1px solid var(--border-soft); }
</style>
</head>
<body>

<div id="topBar">
  <div class="brand">
    <div class="brand-blocks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <h1 class="brand-title">3DBLOCK</h1>
  </div>
  <p>Diseños en bloques, listos para armar</p>
</div>

<main>
  <div id="hero">
    <h1 id="heroTitle">Elegí un diseño</h1>
    <p>Tocá una imagen para verlo. Los diseños con precio piden pago único antes de mostrar el visor 3D completo.</p>
  </div>

  <div id="catNav"></div>
  <div id="loadingState">Cargando catálogo…</div>
  <div id="grid"></div>
  <div id="emptyState">Todavía no hay diseños en esta categoría.</div>
</main>

<footer>3DBLOCK — hecho con bloques, sin esferas ni "beads".</footer>

<script>
const VIEWER_PAGE = 'index.html';
const CATALOG_URL = 'catalog.json';

// Diseños de respaldo, por si "catalog.json" todavía no existe en el repositorio
// (el botón "Publicar" del visor lo crea solo la primera vez que se usa).
const FALLBACK = { designs: [
  { slug:'greeninja', name:'Greninja', price:4, category:'', description:'', thumb:'', src:'https://raw.githubusercontent.com/3DBlocks/3Dblocks/refs/heads/main/greeninja.json' },
  { slug:'squirtle', name:'Squirtle', price:0, category:'', description:'', thumb:'', src:'https://raw.githubusercontent.com/3DBlocks/3Dblocks/refs/heads/main/squirtle%20(2).json' },
] };

function currentCategory(){
  return new URLSearchParams(window.location.search).get('cat') || '';
}

function renderCatNav(designs, active){
  const nav = document.getElementById('catNav');
  const cats = Array.from(new Set(designs.map(d => (d.category||'').trim()).filter(Boolean))).sort();
  if (!cats.length){ nav.innerHTML=''; return; }
  nav.innerHTML = '';
  const allLink = document.createElement('a');
  allLink.href = 'catalogo.html';
  allLink.textContent = 'Todos';
  if (!active) allLink.className = 'active';
  nav.appendChild(allLink);
  cats.forEach(cat=>{
    const a = document.createElement('a');
    a.href = 'catalogo.html?cat=' + encodeURIComponent(cat);
    a.textContent = cat;
    if (active === cat) a.className = 'active';
    nav.appendChild(a);
  });
}

function renderGrid(designs){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';
  if (!designs.length){ empty.classList.add('show'); return; }
  empty.classList.remove('show');

  designs.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    const price = Number(item.price) || 0;
    const priceLabel = price > 0 ? '$' + price.toFixed(2) + ' USD' : 'Gratis';

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap' + (item.thumb ? '' : ' empty');
    if (item.thumb){
      const img = document.createElement('img');
      img.src = item.thumb;
      img.alt = item.name;
      thumbWrap.appendChild(img);
    } else {
      thumbWrap.textContent = 'Sin imagen';
    }
    const tag = document.createElement('div');
    tag.className = 'price-tag' + (price>0 ? '' : ' free');
    tag.textContent = priceLabel;
    thumbWrap.appendChild(tag);

    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = item.name;
    info.appendChild(name);
    if (item.description){
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = item.description;
      info.appendChild(desc);
    }
    const cta = document.createElement('div');
    cta.className = 'cta';
    cta.textContent = price>0 ? 'Tocá para comprar y ver →' : 'Tocá para ver →';
    info.appendChild(cta);

    card.appendChild(thumbWrap);
    card.appendChild(info);
    card.addEventListener('click', ()=>{
      window.location.href = VIEWER_PAGE + '?src=' + encodeURIComponent(item.src);
    });
    grid.appendChild(card);
  });
}

async function init(){
  document.getElementById('loadingState').classList.add('show');
  let data = FALLBACK;
  try{
    const res = await fetch(CATALOG_URL, { cache:'no-store' });
    if (res.ok){
      const j = await res.json();
      if (j && Array.isArray(j.designs) && j.designs.length) data = j;
    }
  } catch(e){ /* usa el respaldo */ }
  document.getElementById('loadingState').classList.remove('show');

  const active = currentCategory();
  const all = data.designs;
  const filtered = active ? all.filter(d => (d.category||'').trim() === active) : all;

  document.getElementById('heroTitle').textContent = active ? ('Categoría: ' + active) : 'Elegí un diseño';
  renderCatNav(all, active);
  renderGrid(filtered);
}
init();
</script>
</body>
</html>
