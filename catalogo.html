<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3DBLOCK · Catálogo</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#080b13" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #080b13;
    --bg-2: #0d1220;
    --panel: #0f1524;
    --panel-2: #131b2e;
    --border: #1d2740;
    --border-soft: #161f34;
    --text: #e8ecf6;
    --text-dim: #8a93ac;
    --text-faint: #545e78;
    --accent: #f2b134;
    --accent-2: #2dd4bf;
    --mono: 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
    --sans: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  #topBar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 22px; border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, var(--panel), var(--bg-2)); position:sticky; top:0; z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-blocks{ display:grid; grid-template-columns:repeat(3,7px); grid-template-rows:repeat(3,7px); gap:2px; }
  .brand-blocks span{ background:var(--accent); display:block; }
  .brand-blocks span:nth-child(2){ background:var(--accent-2); }
  .brand-blocks span:nth-child(5){ background:var(--text-dim); }
  .brand-blocks span:nth-child(8){ background:#1c5049; }
  .brand-title{ font-size:16px; font-weight:800; letter-spacing:.1em; margin:0; }
  #topBar p{ margin:0; font-size:11px; color:var(--text-faint); }

  main{ max-width:1180px; margin:0 auto; padding:28px 22px 60px; }
  #hero{ text-align:center; margin-bottom:22px; }
  #hero h1{ font-size:clamp(22px,4vw,32px); font-weight:800; margin:0 0 8px; letter-spacing:-.01em; }
  #hero p{ font-size:13.5px; color:var(--text-dim); max-width:480px; margin:0 auto; line-height:1.6; }

  #catNav{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:28px; }
  #catNav a{
    text-decoration:none; font-size:12.5px; font-weight:600; color:var(--text-dim);
    background:var(--panel-2); border:1px solid var(--border-soft); border-radius:20px; padding:7px 15px;
    transition:all .12s ease;
  }
  #catNav a:hover{ border-color:var(--accent); color:var(--accent); }
  #catNav a.active{ background:var(--accent); color:#1a1305; border-color:var(--accent); }

  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:18px;
  }
  .card{
    background:var(--panel-2); border:1px solid var(--border-soft); border-radius:12px; overflow:hidden;
    cursor:pointer; transition: transform .15s ease, border-color .15s ease; display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .card .thumb-wrap{ aspect-ratio:1/1; background:#0a0e1a; position:relative; overflow:hidden; }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .thumb-wrap.empty{ display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-family:var(--mono); font-size:11px; }
  .card .price-tag{
    position:absolute; top:8px; right:8px; background:rgba(8,11,19,.85); backdrop-filter:blur(4px);
    border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-family:var(--mono); font-size:11.5px;
    font-weight:700; color:var(--accent);
  }
  .card .price-tag.free{ color:var(--accent-2); }
  .card .del-btn{
    position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:6px;
    background:rgba(242,102,92,.85); backdrop-filter:blur(4px); border:1px solid rgba(242,102,92,.6);
    color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .card .del-btn:hover{ background:#f2665c; }
  #adminBar{ display:flex; align-items:center; gap:8px; }
  #adminBtn, #libraryBtn, #viewerLink{
    font-size:11px; color:var(--text-faint); background:var(--panel-2); border:1px solid var(--border-soft);
    border-radius:16px; padding:6px 12px; cursor:pointer; font-family:var(--sans); text-decoration:none;
    display:inline-flex; align-items:center;
  }
  #adminBtn.on{ color:var(--accent); border-color:var(--accent); }
  #libraryBtn.on{ color:var(--accent-2); border-color:var(--accent-2); }
  .card .info{ padding:12px 14px 14px; }
  .card .name{ font-size:13.5px; font-weight:700; margin:0 0 4px; }
  .card .desc{ font-size:11px; color:var(--text-dim); line-height:1.4; margin:0 0 6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .cta{ font-size:10.5px; color:var(--text-faint); letter-spacing:.02em; }

  #emptyState, #loadingState{ text-align:center; padding:60px 20px; color:var(--text-faint); font-size:13px; display:none; }
  #emptyState.show, #loadingState.show{ display:block; }

  footer{ text-align:center; padding:24px; font-size:10.5px; color:var(--text-faint); border-top:1px solid var(--border-soft); }
</style>
</head>
<body>

<div id="topBar">
  <div class="brand">
    <div class="brand-blocks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <h1 class="brand-title">3DBLOCK</h1>
  </div>
  <p>Diseños en bloques, listos para armar</p>
  <div id="adminBar">
    <a id="viewerLink" href="index.html" style="display:none;">🎨 Visor</a>
    <button id="libraryBtn" style="display:none;">📚 Mis compras</button>
    <button id="adminBtn">Iniciar sesión</button>
  </div>
</div>

<main>
  <div id="hero">
    <h1 id="heroTitle">Elegí un diseño</h1>
    <p>Tocá una imagen para verlo. Los diseños con precio piden pago único antes de mostrar el visor 3D completo.</p>
  </div>

  <div id="catNav"></div>
  <div id="loadingState">Cargando catálogo…</div>
  <div id="grid"></div>
  <div id="emptyState">Todavía no hay diseños en esta categoría.</div>
</main>

<footer>3DBLOCK — hecho con bloques, sin esferas ni "beads".</footer>

<script>
const VIEWER_PAGE = 'index.html';
const CATALOG_URL = 'catalog.json';

const SUPABASE_URL = 'https://cqzfbeyeecypamsgguye.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4mccTooTedhMrGrQAIKcZQ_iQQv-Lc2';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ADMIN_EMAILS = ['rcuyap@gmail.com'];

const GITHUB_OWNER = '3DBlocks';
const GITHUB_REPO = '3Dblocks';
const GITHUB_BRANCH = 'main';

let isAdmin = false;
let catalogData = { designs: [] };

function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }

function getGithubToken(){
  let t = localStorage.getItem('gh_pat');
  if (!t){
    t = prompt('Pegá tu token de GitHub (Personal Access Token) para poder borrar diseños del catálogo:');
    if (t) localStorage.setItem('gh_pat', t.trim());
    else return null;
  }
  return localStorage.getItem('gh_pat');
}

async function githubGetFile(path){
  const token = getGithubToken();
  if (!token) throw new Error('Hace falta el token de GitHub.');
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}&_=${Date.now()}`;
  const res = await fetch(url, { cache:'no-store', headers: { Authorization: 'token '+token, Accept: 'application/vnd.github+json' } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub (' + res.status + '): no se pudo leer ' + path);
  return res.json();
}
async function githubPutFile(path, base64Content, message){
  const token = getGithubToken();
  const existing = await githubGetFile(path).catch(()=>null);
  const body = { message, content: base64Content, branch: GITHUB_BRANCH };
  if (existing && existing.sha) body.sha = existing.sha;
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
  const res = await fetch(url, { method:'PUT', headers:{ Authorization:'token '+token, Accept:'application/vnd.github+json','Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (!res.ok){ const err = await res.json().catch(()=>({})); throw new Error('GitHub (' + res.status + '): ' + (err.message || 'no se pudo guardar ' + path)); }
  return res.json();
}
async function githubDeleteFile(path, message){
  const existing = await githubGetFile(path).catch(()=>null);
  if (!existing) return;
  const token = getGithubToken();
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
  const res = await fetch(url, { method:'DELETE', headers:{ Authorization:'token '+token, Accept:'application/vnd.github+json','Content-Type':'application/json' }, body: JSON.stringify({ message, sha: existing.sha, branch: GITHUB_BRANCH }) });
  if (!res.ok){ const err = await res.json().catch(()=>({})); throw new Error('GitHub (' + res.status + '): ' + (err.message || 'no se pudo borrar ' + path)); }
}

async function deleteDesign(item){
  if (!confirm('¿Borrar "' + item.name + '" del catálogo? También se borra su archivo y su foto. No se puede deshacer.')) return;
  if (!getGithubToken()) return;
  try{
    const file = await githubGetFile('catalog.json');
    if (file){
      const data = JSON.parse(base64ToUtf8(file.content));
      data.designs = (data.designs || []).filter(d => d.slug !== item.slug);
      await githubPutFile('catalog.json', utf8ToBase64(JSON.stringify(data, null, 2)), 'Borrar del catálogo: ' + item.name);
    }
    if (item.slug){
      await githubDeleteFile('designs/' + item.slug + '.json', 'Borrar diseño: ' + item.name);
      await githubDeleteFile('thumbs/' + item.slug + '.png', 'Borrar portada: ' + item.name);
    }
    init();
  } catch(err){
    alert('Error al borrar: ' + err.message);
  }
}

// Diseños de respaldo, por si "catalog.json" todavía no existe en el repositorio
// (el botón "Publicar" del visor lo crea solo la primera vez que se usa).
const FALLBACK = { designs: [
  { slug:'greeninja', name:'Greninja', price:4, category:'', description:'', thumb:'', src:'https://raw.githubusercontent.com/3DBlocks/3Dblocks/refs/heads/main/greeninja.json' },
  { slug:'squirtle', name:'Squirtle', price:0, category:'', description:'', thumb:'', src:'https://raw.githubusercontent.com/3DBlocks/3Dblocks/refs/heads/main/squirtle%20(2).json' },
] };

function currentCategory(){
  return new URLSearchParams(window.location.search).get('cat') || '';
}

function renderCatNav(designs, active){
  const nav = document.getElementById('catNav');
  const cats = Array.from(new Set(designs.map(d => (d.category||'').trim()).filter(Boolean))).sort();
  if (!cats.length){ nav.innerHTML=''; return; }
  nav.innerHTML = '';
  const allLink = document.createElement('a');
  allLink.href = 'catalogo.html';
  allLink.textContent = 'Todos';
  if (!active) allLink.className = 'active';
  nav.appendChild(allLink);
  cats.forEach(cat=>{
    const a = document.createElement('a');
    a.href = 'catalogo.html?cat=' + encodeURIComponent(cat);
    a.textContent = cat;
    if (active === cat) a.className = 'active';
    nav.appendChild(a);
  });
}

function renderGrid(designs){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';
  if (!designs.length){ empty.classList.add('show'); return; }
  empty.classList.remove('show');

  designs.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    const price = Number(item.price) || 0;
    const priceLabel = price > 0 ? '$' + price.toFixed(2) + ' USD' : 'Gratis';

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap' + (item.thumb ? '' : ' empty');
    if (item.thumb){
      const img = document.createElement('img');
      img.src = item.thumb;
      img.alt = item.name;
      thumbWrap.appendChild(img);
    } else {
      thumbWrap.textContent = 'Sin imagen';
    }
    const tag = document.createElement('div');
    tag.className = 'price-tag' + (price>0 ? '' : ' free');
    tag.textContent = priceLabel;
    thumbWrap.appendChild(tag);

    if (isAdmin){
      const del = document.createElement('div');
      del.className = 'del-btn';
      del.textContent = '🗑';
      del.title = 'Borrar del catálogo';
      del.addEventListener('click', e=>{ e.stopPropagation(); deleteDesign(item); });
      thumbWrap.appendChild(del);
    }

    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = item.name;
    info.appendChild(name);
    if (item.description){
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = item.description;
      info.appendChild(desc);
    }
    const cta = document.createElement('div');
    cta.className = 'cta';
    cta.textContent = price>0 ? 'Tocá para comprar y ver →' : 'Tocá para ver →';
    info.appendChild(cta);

    card.appendChild(thumbWrap);
    card.appendChild(info);
    card.addEventListener('click', ()=>{
      window.location.href = VIEWER_PAGE + '?src=' + encodeURIComponent(item.src);
    });
    grid.appendChild(card);
  });
}

async function init(){
  document.getElementById('loadingState').classList.add('show');
  let data = FALLBACK;
  try{
    const res = await fetch(CATALOG_URL, { cache:'no-store' });
    if (res.ok){
      const j = await res.json();
      if (j && Array.isArray(j.designs) && j.designs.length) data = j;
    }
  } catch(e){ /* usa el respaldo */ }
  document.getElementById('loadingState').classList.remove('show');
  catalogData = data;

  const active = currentCategory();
  const all = data.designs;
  const filtered = active ? all.filter(d => (d.category||'').trim() === active) : all;

  document.getElementById('heroTitle').textContent = active ? ('Categoría: ' + active) : 'Elegí un diseño';
  renderCatNav(all, active);
  renderGrid(filtered);
}

/* ---------------------------- Sesión: cualquiera puede iniciar sesión para
   ver su biblioteca de compras; la cuenta admin además puede borrar diseños. ---------------------------- */
let libraryMode = false;
let currentUserEmail = null;

async function checkAdmin(){
  const { data } = await sb.auth.getSession();
  currentUserEmail = data.session?.user?.email?.toLowerCase() || null;
  isAdmin = !!(currentUserEmail && ADMIN_EMAILS.includes(currentUserEmail));
  const btn = document.getElementById('adminBtn');
  const libBtn = document.getElementById('libraryBtn');
  const viewerLink = document.getElementById('viewerLink');
  if (currentUserEmail){
    btn.textContent = isAdmin ? '🔓 ' + currentUserEmail + ' · Salir' : currentUserEmail + ' · Salir';
    btn.classList.toggle('on', isAdmin);
    libBtn.style.display = '';
    viewerLink.style.display = isAdmin ? '' : 'none';
  } else {
    btn.textContent = 'Iniciar sesión';
    btn.classList.remove('on');
    libBtn.style.display = 'none';
    viewerLink.style.display = 'none';
    libraryMode = false;
  }
}

async function loadMyPurchasedSrcs(){
  const { data: userData } = await sb.auth.getUser();
  if (!userData.user) return [];
  const { data } = await sb.from('purchases').select('design_id').eq('user_id', userData.user.id);
  return (data || []).map(r => r.design_id);
}

async function showLibrary(){
  libraryMode = true;
  document.getElementById('libraryBtn').classList.add('on');
  document.getElementById('catNav').style.display = 'none';
  document.getElementById('heroTitle').textContent = 'Tu biblioteca';
  document.getElementById('loadingState').classList.add('show');
  const purchasedSrcs = await loadMyPurchasedSrcs();
  document.getElementById('loadingState').classList.remove('show');
  const mine = catalogData.designs.filter(d => purchasedSrcs.includes(d.src));
  renderGrid(mine);
  if (!mine.length) document.getElementById('emptyState').textContent = 'Todavía no compraste ningún diseño.';
}

function exitLibrary(){
  libraryMode = false;
  document.getElementById('libraryBtn').classList.remove('on');
  document.getElementById('catNav').style.display = '';
  document.getElementById('emptyState').textContent = 'Todavía no hay diseños en esta categoría.';
  const active = currentCategory();
  document.getElementById('heroTitle').textContent = active ? ('Categoría: ' + active) : 'Elegí un diseño';
  renderGrid(active ? catalogData.designs.filter(d=>(d.category||'').trim()===active) : catalogData.designs);
}

document.getElementById('libraryBtn').addEventListener('click', ()=>{
  if (libraryMode) exitLibrary(); else showLibrary();
});

document.getElementById('adminBtn').addEventListener('click', async ()=>{
  const { data } = await sb.auth.getSession();
  if (data.session){ await sb.auth.signOut(); location.reload(); return; }
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href } });
});
sb.auth.onAuthStateChange(async ()=>{
  await checkAdmin();
  if (!libraryMode){
    const active = currentCategory();
    renderGrid(active ? catalogData.designs.filter(d=>(d.category||'').trim()===active) : catalogData.designs);
  }
});

checkAdmin();
init();
</script>
</body>
</html>
